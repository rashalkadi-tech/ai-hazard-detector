<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Hazard Detector</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<style>
:root {
  --red: #E24B4A;
  --yellow: #EF9F27;
  --green: #639922;
  --green-light: #97C459;
  --gray: #888780;
  --bg: #0a0d0f;
  --surface: #111518;
  --surface2: #181d21;
  --border: rgba(255,255,255,0.08);
  --text: #e8e4dc;
  --text-muted: #6b7580;
  --font-display: 'Rajdhani', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-display);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 4px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 60px);
  pointer-events: none;
  z-index: 0;
}
.app-wrapper {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-logo { display: flex; align-items: center; gap: 10px; }
.hazard-icon {
  width: 32px; height: 32px;
  background: var(--yellow);
  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  position: relative;
  flex-shrink: 0;
}
.hazard-icon::after {
  content: '!';
  position: absolute;
  bottom: 4px; left: 50%;
  transform: translateX(-50%);
  font-size: 14px; font-weight: 700;
  color: #0a0d0f;
  font-family: var(--font-display);
}
.header-title {
  font-size: 16px; font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  line-height: 1.1;
}
.header-title span {
  display: block; font-size: 10px; font-weight: 400;
  color: var(--text-muted); letter-spacing: 0.2em;
  font-family: var(--font-mono);
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: background 0.3s;
}
.status-dot.active { background: var(--green-light); animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.camera-section {
  position: relative;
  background: var(--surface);
  aspect-ratio: 4/3;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
}
.camera-placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px;
  background: var(--surface2);
}
.cam-icon {
  width: 48px; height: 48px;
  border: 2px solid var(--text-muted);
  border-radius: 8px;
  position: relative; opacity: 0.5;
}
.cam-icon::before {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid var(--text-muted);
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
}
.scan-corners { position: absolute; inset: 0; pointer-events: none; }
.corner { position: absolute; width: 24px; height: 24px; }
.corner-tl { top: 16px; left: 16px; border-top: 2px solid var(--yellow); border-left: 2px solid var(--yellow); }
.corner-tr { top: 16px; right: 16px; border-top: 2px solid var(--yellow); border-right: 2px solid var(--yellow); }
.corner-bl { bottom: 16px; left: 16px; border-bottom: 2px solid var(--yellow); border-left: 2px solid var(--yellow); }
.corner-br { bottom: 16px; right: 16px; border-bottom: 2px solid var(--yellow); border-right: 2px solid var(--yellow); }
.scan-line {
  position: absolute; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--yellow), transparent);
  opacity: 0; top: 0;
}
.scan-line.active { opacity: 0.7; animation: scanDown 2.5s linear infinite; }
@keyframes scanDown { 0%{top:0%} 100%{top:100%} }
.live-badge {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  background: rgba(10,13,15,0.8);
  border: 1px solid var(--border);
  padding: 4px 10px; border-radius: 4px;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.15em; color: var(--text-muted);
  display: flex; align-items: center; gap: 6px;
}
.live-badge.scanning { border-color: var(--yellow); color: var(--yellow); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.live-badge.scanning .live-dot { animation: blink 0.8s infinite; }

.alert-banner {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 16px 20px;
  display: flex; align-items: center; gap: 12px;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.2,0,0,1);
  z-index: 10;
}
.alert-banner.visible { transform: translateY(0); }
.alert-banner.state-green { background: rgba(10,13,15,0.92); border-top: 2px solid var(--green); }
.alert-banner.state-yellow { background: rgba(10,13,15,0.92); border-top: 2px solid var(--yellow); }
.alert-banner.state-red { background: rgba(10,13,15,0.92); border-top: 2px solid var(--red); animation: redPulse 0.6s infinite; }
.alert-banner.state-gray { background: rgba(10,13,15,0.92); border-top: 2px solid var(--gray); }
@keyframes redPulse { 0%,100%{border-top-color: var(--red)} 50%{border-top-color: rgba(226,75,74,0.3)} }
.alert-icon {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; flex-shrink: 0;
}
.state-green .alert-icon { background: rgba(99,153,34,0.15); color: var(--green-light); }
.state-yellow .alert-icon { background: rgba(239,159,39,0.15); color: var(--yellow); }
.state-red .alert-icon { background: rgba(226,75,74,0.15); color: var(--red); }
.state-gray .alert-icon { background: rgba(136,135,128,0.15); color: var(--gray); }
.alert-text-wrap { flex: 1; }
.alert-label { font-size: 10px; font-family: var(--font-mono); letter-spacing: 0.2em; color: var(--text-muted); margin-bottom: 2px; }
.alert-message { font-size: 17px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.state-green .alert-message { color: var(--green-light); }
.state-yellow .alert-message { color: var(--yellow); }
.state-red .alert-message { color: var(--red); }
.state-gray .alert-message { color: var(--gray); }

.confidence-section { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; }
.conf-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing: 0.1em; }
.conf-value { font-size: 14px; font-weight: 600; color: var(--text); }
.conf-bar-track { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.conf-bar-fill { height: 100%; width: 0%; border-radius: 2px; transition: width 0.4s ease, background 0.4s ease; background: var(--gray); }

.labels-section { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 8px; }
.label-pill { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; text-align: center; transition: all 0.3s; }
.label-pill.active-green { border-color: var(--green); background: rgba(99,153,34,0.08); }
.label-pill.active-yellow { border-color: var(--yellow); background: rgba(239,159,39,0.08); }
.label-pill.active-red { border-color: var(--red); background: rgba(226,75,74,0.08); }
.pill-name { font-size: 10px; font-family: var(--font-mono); color: var(--text-muted); letter-spacing: 0.1em; margin-bottom: 2px; }
.pill-pct { font-size: 16px; font-weight: 700; color: var(--text); transition: color 0.3s; }
.label-pill.active-green .pill-pct { color: var(--green-light); }
.label-pill.active-yellow .pill-pct { color: var(--yellow); }
.label-pill.active-red .pill-pct { color: var(--red); }

.controls-section { padding: 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.start-btn {
  width: 100%; padding: 16px;
  background: transparent; border: 1px solid var(--yellow); border-radius: 6px;
  color: var(--yellow); font-family: var(--font-display); font-size: 16px; font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; transition: all 0.2s;
}
.start-btn:hover { background: rgba(239,159,39,0.08); }
.start-btn:active { transform: scale(0.98); }
.start-btn:disabled { border-color: var(--text-muted); color: var(--text-muted); cursor: not-allowed; }
.stop-btn {
  width: 100%; padding: 12px;
  background: transparent; border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-muted); font-family: var(--font-display); font-size: 14px; font-weight: 600;
  letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; display: none;
}
.stop-btn:hover { border-color: var(--red); color: var(--red); }
.log-section {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
  height: 100px; overflow-y: auto; flex: 1;
}
.log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
.log-entry:last-child { border-bottom: none; }
.log-entry.log-green { color: var(--green-light); }
.log-entry.log-red { color: var(--red); }
.log-entry.log-yellow { color: var(--yellow); }

.bottom-nav { background: var(--surface); border-top: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-around; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 10px; font-family: var(--font-mono); letter-spacing: 0.1em; cursor: pointer; transition: color 0.2s; }
.nav-item:hover { color: var(--yellow); }
.nav-icon { width: 20px; height: 16px; border: 1.5px solid currentColor; border-radius: 3px; }

#webcam-container canvas { width: 100% !important; height: 100% !important; object-fit: cover; }
#webcam-container { width: 100%; height: 100%; position: absolute; inset: 0; }
</style>
</head>
<body>
<div class="app-wrapper">
  <div class="header">
    <div class="header-logo">
      <div class="hazard-icon"></div>
      <div class="header-title">
        Landmine AI Detector
        <span>v2.1 &middot; FIELD MODE</span>
      </div>
    </div>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <div class="camera-section">
    <div class="camera-placeholder" id="cameraPlaceholder">
      <div class="cam-icon"></div>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:0.1em;">CAMERA INACTIVE</span>
    </div>
    <div id="webcam-container"></div>
    <div class="scan-corners">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
    </div>
    <div class="scan-line" id="scanLine"></div>
    <div class="live-badge" id="liveBadge">
      <div class="live-dot"></div>
      <span id="liveBadgeText">STANDBY</span>
    </div>
    <div class="alert-banner" id="alertBanner">
      <div class="alert-icon" id="alertIcon">&#8212;</div>
      <div class="alert-text-wrap">
        <div class="alert-label">DETECTION STATUS</div>
        <div class="alert-message" id="alertMessage">&#8212;</div>
      </div>
    </div>
  </div>

  <div class="confidence-section">
    <div class="conf-header">
      <span>CONFIDENCE</span>
      <span class="conf-value" id="confValue">&#8212;</span>
    </div>
    <div class="conf-bar-track">
      <div class="conf-bar-fill" id="confBar"></div>
    </div>
  </div>

  <div class="labels-section">
    <div class="label-pill" id="pillSafe">
      <div class="pill-name">SAFE</div>
      <div class="pill-pct" id="pctSafe">0%</div>
    </div>
    <div class="label-pill" id="pillPost">
      <div class="pill-name">POST-EXP</div>
      <div class="pill-pct" id="pctPost">0%</div>
    </div>
    <div class="label-pill" id="pillActive">
      <div class="pill-name">ACTIVE</div>
      <div class="pill-pct" id="pctActive">0%</div>
    </div>
  </div>

  <div class="controls-section">
    <button class="start-btn" id="startBtn" onclick="startApp()">&#9654; INITIALIZE DETECTION</button>
    <button class="stop-btn" id="stopBtn" onclick="stopApp()">&#9632; STOP SCANNING</button>
    <div class="log-section" id="logSection">
      <div class="log-entry">[SYS] System ready. Press initialize to begin.</div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item"><div class="nav-icon"></div>MAP</div>
    <div class="nav-item"><div class="nav-icon"></div>LOGS</div>
    <div class="nav-item"><div class="nav-icon"></div>STATUS</div>
  </div>
</div>

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

let currentSource = null;

async function playBase64Audio(b64) {
  try {
    const ctx = getAudioCtx();
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const buffer = await ctx.decodeAudioData(bytes.buffer);
    if (currentSource) { try { currentSource.stop(); } catch(e) {} }
    currentSource = ctx.createBufferSource();
    currentSource.buffer = buffer;
    currentSource.connect(ctx.destination);
    currentSource.start(0);
  } catch(e) { addLog('[AUDIO] ' + e.message, ''); }
}

function stopAudio() {
  if (currentSource) { try { currentSource.stop(); } catch(e) {} currentSource = null; }
}

async function playSound(type) {
  const key = type === 'state-green' ? 'green' : type === 'state-red' ? 'red' : type === 'state-yellow' ? 'yellow' : null;
  if (key) await playBase64Audio(AUDIO_B64[key]);
}

function addLog(msg, cls) {
  const log = document.getElementById('logSection');
  const entry = document.createElement('div');
  entry.className = 'log-entry' + (cls ? ' log-' + cls : '');
  const now = new Date();
  const ts = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
  entry.textContent = '[' + ts + '] ' + msg;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function updateConfidence(pct) {
  document.getElementById('confBar').style.width = (pct * 100).toFixed(1) + '%';
  document.getElementById('confValue').textContent = (pct * 100).toFixed(1) + '%';
  document.getElementById('confBar').style.background = pct > 0.7 ? 'var(--green)' : pct > 0.4 ? 'var(--yellow)' : 'var(--gray)';
}

function updatePills(predictions) {
  predictions.forEach(p => {
    const name = (p.className || '').toLowerCase();
    const pct = (p.probability * 100).toFixed(0) + '%';
    if (name.includes('active')) document.getElementById('pctActive').textContent = pct;
    else if (name.includes('post')) document.getElementById('pctPost').textContent = pct;
    else document.getElementById('pctSafe').textContent = pct;
  });
}

function clearPills() {
  ['pillSafe','pillPost','pillActive'].forEach(id => document.getElementById(id).className = 'label-pill');
}

function getHazardState(prediction, confidence) {
  const p = (prediction || '').toLowerCase();
  if (confidence < 0.7) return { type: 'state-gray', message: 'UNCERTAIN — STAY CAUTIOUS', icon: '?' };
  if (p.includes('active')) return { type: 'state-red', message: 'DANGER! LANDMINE DETECTED', icon: '!' };
  if (p.includes('post')) return { type: 'state-yellow', message: 'STAY SAFE — EXPLOSION AREA', icon: '\u26a0' };
  return { type: 'state-green', message: 'YOU ARE SAFE', icon: '\u2713' };
}

function showBanner(result) {
  const banner = document.getElementById('alertBanner');
  banner.className = 'alert-banner visible ' + result.type;
  document.getElementById('alertIcon').textContent = result.icon;
  document.getElementById('alertMessage').textContent = result.message;
  playSound(result.type);
  if (result.type === 'state-red' && navigator.vibrate) navigator.vibrate([300,100,300,100,300]);
}

function handleDetection(prediction, confidence, all) {
  const result = getHazardState(prediction, confidence);
  updateConfidence(confidence);
  if (all) updatePills(all);
  clearPills();
  const p = (prediction || '').toLowerCase();
  if (p.includes('active')) document.getElementById('pillActive').className = 'label-pill active-red';
  else if (p.includes('post')) document.getElementById('pillPost').className = 'label-pill active-yellow';
  else if (confidence >= 0.7) document.getElementById('pillSafe').className = 'label-pill active-green';
  if (result.type === lastState) return;
  lastState = result.type;
  clearTimeout(detectionTimer);
  detectionTimer = setTimeout(() => {
    showBanner(result);
    const lc = result.type === 'state-green' ? 'green' : result.type === 'state-red' ? 'red' : result.type === 'state-yellow' ? 'yellow' : '';
    addLog(result.message, lc);
  }, 1500);
}

async function startApp() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = '\u27f3 LOADING MODEL...';
  addLog('Initializing AI model...');
  getAudioCtx();
  try {
    if (!window.tmImage) { addLog('[ERR] Teachable Machine library not loaded'); btn.disabled = false; btn.textContent = '\u25b6 INITIALIZE DETECTION'; return; }
    model = await tmImage.load(MODEL_URL + 'model.json', MODEL_URL + 'metadata.json');
    addLog('Model loaded. Starting camera...');
    webcam = new tmImage.Webcam(400, 400, true);
    await webcam.setup();
    await webcam.play();
    document.getElementById('cameraPlaceholder').style.display = 'none';
    document.getElementById('webcam-container').appendChild(webcam.canvas);
    running = true;
    document.getElementById('statusDot').className = 'status-dot active';
    document.getElementById('scanLine').className = 'scan-line active';
    document.getElementById('liveBadge').className = 'live-badge scanning';
    document.getElementById('liveBadgeText').textContent = 'SCANNING ACTIVE';
    btn.style.display = 'none';
    document.getElementById('stopBtn').style.display = 'block';
    addLog('Detection active. Scanning field area...');
    window.requestAnimationFrame(loop);
  } catch(e) {
    addLog('[ERR] ' + e.message);
    btn.disabled = false;
    btn.textContent = '\u25b6 INITIALIZE DETECTION';
  }
}

function stopApp() {
  running = false;
  if (webcam) { try { webcam.stop(); } catch(e) {} }
  stopAudio();
  document.getElementById('statusDot').className = 'status-dot';
  document.getElementById('scanLine').className = 'scan-line';
  document.getElementById('liveBadge').className = 'live-badge';
  document.getElementById('liveBadgeText').textContent = 'STANDBY';
  document.getElementById('alertBanner').className = 'alert-banner';
  document.getElementById('webcam-container').innerHTML = '';
  document.getElementById('cameraPlaceholder').style.display = 'flex';
  document.getElementById('stopBtn').style.display = 'none';
  const btn = document.getElementById('startBtn');
  btn.style.display = 'block'; btn.disabled = false;
  btn.textContent = '\u25b6 INITIALIZE DETECTION';
  clearPills(); lastState = null;
  addLog('Detection stopped.');
}

async function loop() {
  if (!running) return;
  webcam.update();
  await predict();
  requestAnimationFrame(loop);
}

async function predict() {
  if (!model || !webcam) return;
  try {
    const preds = await model.predict(webcam.canvas);
    if (!preds || !preds.length) return;
    const best = preds.reduce((a,b) => a.probability > b.probability ? a : b);
    handleDetection(best.className, best.probability, preds);
  } catch(e) {}
}
